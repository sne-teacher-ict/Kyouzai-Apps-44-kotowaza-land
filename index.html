<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />

  <meta name="theme-color" content="#fff7df" />
  <title>ことわざランド</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

      <p class="eyebrow">ことばを たのしく まなぼう！</p>

    </div>
    <div class="header-actions">

      <button id="homeBtn" class="icon-btn" aria-label="ホームへ戻る">🏠</button>
    </div>
  </header>

  <main id="app" class="app-shell" aria-live="polite"></main>

  <footer>
    <span>ことわざランド v3</span>
    <span id="progressSummary"></span>
  </footer>

  <script src="app.js"></script>

</html>
